:root{
  --bg:#0d0a05; --bg2:#1a1208; --panel:#2c1810; --line:#3c2a15; --line2:#5c3a10;
  --gold:#d4a96a; --gold2:#f0d4a0; --golddim:#8b6914; --text:#e8d5b8; --warm:#a08060; --dim:#7a6545;
  --red:#e5484d; --green:#6b8b5a; --orange:#E65100;
  --deva:'Lalita Deva','Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN','Mangal',sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:22px;color:var(--gold2);line-height:1.2}
h2{font-size:18px;color:var(--gold);margin:22px 0 10px}
.sub{color:var(--warm);font-size:15px;margin-top:4px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.muted{color:var(--warm);font-size:15px}
.small{font-size:14px;color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:17px;text-align:center}
.btn.primary{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.btn.rec{background:var(--red);color:#fff;border-color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:48px;padding:8px 14px;font-size:15px;border-radius:12px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{min-height:64px;border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600}
.chip .small{font-weight:400;font-size:13px}
.chip.on{border-color:var(--gold);background:#3a2410;color:var(--gold2)}
.chip.all{grid-column:span 3}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{min-height:84px;border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:10px;text-align:left}
.mode b{display:block;font-size:17px}
.mode.on{border-color:var(--gold);background:#3a2410}
.mic{display:flex;gap:12px;align-items:flex-start}
.mic .ico{font-size:28px;line-height:1}
.mic.denied{border-color:#7a2a20;background:#2a120c}
.meter{height:10px;border-radius:5px;background:#000;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .08s}
.tip{margin-top:14px;color:var(--warm);font-size:15px}
/* record screen */
.rec-screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.rec-main{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.rec-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.keep{margin-top:10px;padding:10px 12px;border-radius:12px;background:#2a1a0c;border:1px solid var(--line2);font-size:15px;color:var(--gold2)}
.progress{display:flex;gap:4px;margin-top:12px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--green)}.progress i.cur{background:var(--gold)}
.nama-card{margin-top:14px;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:18px 14px;text-align:center;flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
.nama-num{display:inline-block;margin:0 auto 6px;padding:2px 12px;border-radius:999px;background:var(--panel);color:var(--gold);font-weight:700;font-size:15px}
.deva-big{font-family:var(--deva);font-weight:700;color:var(--gold2);font-size:clamp(34px,10.5vw,50px);line-height:1.35;overflow-wrap:anywhere}
.deva-big .ln,.clip .d .ln{display:block;white-space:nowrap}
.next-prev.np{display:block}.np-label{font-size:13px;color:var(--warm)}.next-prev .deva .ln{display:block;white-space:nowrap}
.syls{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:6px 2px;margin-top:14px}
.syl{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 4px 2px;font-family:var(--deva)}
.syl .st{font-size:22px;line-height:1.3}
.syl .wm{font-size:18px;line-height:1;color:var(--warm);font-family:var(--ui)}
.syl.g{min-width:50px;background:#3a2410;font-weight:800;color:var(--gold2)}
.syl.g .wm{color:var(--gold);font-weight:900;letter-spacing:-1px}
.syl.l{min-width:26px;font-weight:400;color:var(--text)}
.sep{color:var(--dim);font-size:20px;line-height:1.6;padding:0 1px}
.iast{margin-top:12px;font-size:18px;color:var(--text);font-style:italic;overflow-wrap:anywhere}
.simple{margin-top:4px;font-size:15px;color:var(--warm);overflow-wrap:anywhere}
.legend{margin-top:10px;font-size:13px;color:var(--dim)}
.next-prev{margin-top:12px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--warm);font-size:15px;display:flex;gap:8px;align-items:baseline;overflow:hidden}
.next-prev .deva{font-family:var(--deva);font-size:20px;color:var(--text);overflow-wrap:anywhere;min-width:0}
.hint{margin-top:10px;text-align:center;color:var(--warm);font-size:15px}
.rec-bottom{flex:none;padding-top:10px;background:var(--bg)}
/* Compact recording screen: applied by media query on short phones, and by fitRecord() (classes .compact then .tight) whenever content would not fit above the buttons */
@media (max-height:760px){
  .rec-screen{padding-top:calc(8px + env(safe-area-inset-top))}
  .rec-screen .rec-top{font-size:15px}.rec-screen .timer{font-size:15px}
  .rec-screen .keep{margin-top:6px;padding:5px 10px;font-size:13px;border-radius:10px}
  .rec-screen .meter{height:5px;margin-top:6px}
  .rec-screen .progress{margin-top:6px}.rec-screen .progress i{height:4px}
  .rec-screen .nama-card{margin-top:8px;padding:8px 10px;border-radius:16px}
  .rec-screen .nama-num{font-size:13px;margin-bottom:2px;padding:1px 10px}
  .rec-screen .deva-big{font-size:clamp(28px,9vw,38px);line-height:1.3}
  .rec-screen .syls{margin-top:8px;gap:4px 1px}
  .rec-screen .syl{padding:2px 3px 1px;border-radius:8px}
  .rec-screen .syl .st{font-size:18px;line-height:1.25}.rec-screen .syl .wm{font-size:14px}
  .rec-screen .syl.g{min-width:36px}.rec-screen .syl.l{min-width:20px}
  .rec-screen .sep{font-size:15px;line-height:1.5}
  .rec-screen .iast{margin-top:6px;font-size:15px}.rec-screen .simple{font-size:13px;margin-top:2px}
  .rec-screen .legend{margin-top:4px;font-size:12px}
  .rec-screen .next-prev{margin-top:6px;padding:6px 10px;font-size:13px}.rec-screen .next-prev .deva{font-size:16px}
  .rec-screen .hint{margin-top:6px;font-size:13px}
  .rec-screen .rec-bottom{padding-top:8px}
  .rec-screen .next-btn{min-height:72px;font-size:23px;border-radius:16px}
  .rec-screen .rec-actions{margin-top:8px}.rec-screen .rec-actions .btn.sm{min-height:44px}
}
.rec-screen.compact{padding-top:calc(8px + env(safe-area-inset-top))}
.rec-screen.compact .rec-top{font-size:15px}.rec-screen.compact .timer{font-size:15px}
.rec-screen.compact .keep{margin-top:6px;padding:5px 10px;font-size:13px;border-radius:10px}
.rec-screen.compact .meter{height:5px;margin-top:6px}
.rec-screen.compact .progress{margin-top:6px}.rec-screen.compact .progress i{height:4px}
.rec-screen.compact .nama-card{margin-top:8px;padding:8px 10px;border-radius:16px}

.rec-screen.compact .deva-big{font-size:clamp(28px,9vw,38px);line-height:1.3}
.rec-screen.compact .syls{margin-top:8px;gap:4px 1px}
.rec-screen.compact .syl{padding:2px 3px 1px;border-radius:8px}
.rec-screen.compact .syl .st{font-size:18px;line-height:1.25}.rec-screen.compact .syl .wm{font-size:14px}
.rec-screen.compact .syl.g{min-width:36px}.rec-screen.compact .syl.l{min-width:20px}
.rec-screen.compact .sep{font-size:15px;line-height:1.5}
.rec-screen.compact .iast{margin-top:6px;font-size:15px}.rec-screen.compact .simple{font-size:13px;margin-top:2px}
.rec-screen.compact .legend{margin-top:4px;font-size:12px}
.rec-screen.compact .next-prev{margin-top:6px;padding:6px 10px;font-size:13px}.rec-screen.compact .next-prev .deva{font-size:16px}
.rec-screen.compact .hint{margin-top:6px;font-size:13px}
.rec-screen.compact .rec-bottom{padding-top:8px}
.rec-screen.compact .next-btn{min-height:72px;font-size:23px;border-radius:16px}
.rec-screen.compact .rec-actions{margin-top:8px}.rec-screen.compact .rec-actions .btn.sm{min-height:44px}
.rec-screen.tight .deva-big{font-size:clamp(26px,8vw,32px)}
.rec-screen.tight .legend{display:none}
.rec-screen.tight .syl .st{font-size:16px}.rec-screen.tight .syl .wm{font-size:12px}.rec-screen.tight .syl.g{min-width:32px}.rec-screen.tight .syl.l{min-width:18px}
.rec-screen.tight .iast{font-size:14px}.rec-screen.tight .simple{font-size:12px}
.rec-screen.tight .next-btn{min-height:64px;font-size:22px}
.next-btn{width:100%;min-height:96px;border-radius:20px;background:var(--gold);color:#1a1208;font-size:26px;font-weight:800}
.next-btn.finish{background:var(--green);color:#fff}
.rec-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
/* review */
.verse-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.verse-h h2{margin:0}
.clip{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:8px}
.clip.playing{border-color:var(--gold);background:#3a2410;box-shadow:0 0 0 2px rgba(212,169,106,.25)}
.clip.missing{opacity:.7}
.clip .n{font-weight:800;color:var(--gold);font-size:18px;text-align:center}
.clip .d{font-family:var(--deva);font-size:21px;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.clip .t{font-size:13px;color:var(--warm);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.clip .acts{display:flex;gap:6px}
.icon-btn{min-width:48px;min-height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);font-size:18px;display:flex;align-items:center;justify-content:center}
.warn{color:#ffb38a}
.now{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0}
.now .nama-card{margin-top:0;padding:10px}
.now .deva-big{font-size:30px}.now .syl .st{font-size:17px}.now .syl .wm{font-size:14px}.now .syl.g{min-width:38px}.now .simple,.now .legend{display:none}.now .iast{margin-top:6px;font-size:15px}
.pbar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--gold)}
.file{padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:10px}
.file b{overflow-wrap:anywhere}
.file audio{width:100%;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;max-width:90vw;z-index:9;font-size:15px}
.alert{border-color:#a0442a;background:#2a120c;color:#ffd2bf}
.saved{border-color:var(--green);background:#16200f}
.hidden{display:none!important}

  micInsecure: 'The microphone only works when this page is opened from a secure https:// link.',

/* ───────── Data (namas 1–16; ॐ is an un-numbered invocation and is not included) ───────── */
const DATA = JSON.parse(document.getElementById('nama-data').textContent);
const NAMAS = [];
for (const v of DATA.verses) for (const n of v.namas) NAMAS.push({ ...n, verse: v.verse });
const BY_N = Object.fromEntries(NAMAS.map(n => [n.n, n]));
const VERSES = DATA.verses.map(v => v.verse);
const namasOfVerse = v => NAMAS.filter(n => n.verse === v).map(n => n.n);

/* ───────── Clip padding ─────────
   Tap times are when the user tapped (start = the tap that began the nama, end = the Next tap).
   Exported clips start at the start tap (lead-in is 0) and add a 300 ms tail after the end tap so held final vowels aren't clipped. */
const PAD = { lead: 0, tail: 0.30 };
function clipBounds(c, takeDur) {
  const d = (takeDur && isFinite(takeDur)) ? takeDur : Infinity;
  return { clipStart: r3(Math.max(0, c.start - PAD.lead)), clipEnd: r3(Math.min(d, c.end + PAD.tail)) };
}

/* ───────── Utils ───────── */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
